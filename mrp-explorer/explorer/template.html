<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRP 2026 Explorer</title>
<!--
  MRP 2026 Explorer — unofficial tool for YPP Managed Reassignment Programme candidates.
  This file is generated by scripts/build.py from explorer/template.html. Edit the template, not the dist file.
  Everything is inline: no server, no network requests. Personal data (stars, ranks, notes, tags, hidden posts)
  is stored only in this browser's localStorage, keyed by MJO number, and is never part of this file.
-->
<style>
/* ------------------------------------------------------------------ design tokens (light / dark) */
:root {
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #efefec; --border: #d9d8d3;
  --text: #0b0b0b; --text-2: #52514e; --muted: #6b6a66;
  --accent: #1c5cab; --accent-bg: #e3edfb; --focus: #2a78d6; --bar: #2a78d6;
  --ok: #0b6e0b; --ok-bg: #e3f3e3; --warn: #8a5a00; --warn-bg: #fdf1d6; --bad: #a12b2b; --bad-bg: #fbe4e4;
  --unof: #6a4c00; --unof-bg: #fff8e6; --unof-border: #d9a520;
  --mark: #ffe066;
  --radius: 8px; --shadow: 0 1px 2px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #3a3a37;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #a09f97;
    --accent: #86b6ef; --accent-bg: #1d2b3d; --focus: #5598e7; --bar: #3987e5;
    --ok: #7fd77f; --ok-bg: #16301a; --warn: #f3c25a; --warn-bg: #3a2e12; --bad: #f09a9a; --bad-bg: #3d1c1c;
    --unof: #f3d27a; --unof-bg: #2a2412; --unof-border: #8a6a1a;
    --mark: #8a6d00;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #3a3a37;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #a09f97;
  --accent: #86b6ef; --accent-bg: #1d2b3d; --focus: #5598e7; --bar: #3987e5;
  --ok: #7fd77f; --ok-bg: #16301a; --warn: #f3c25a; --warn-bg: #3a2e12; --bad: #f09a9a; --bad-bg: #3d1c1c;
  --unof: #f3d27a; --unof-bg: #2a2412; --unof-border: #8a6a1a;
  --mark: #8a6d00;
  color-scheme: dark;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; } h4 { font-size: 1rem; }
p { margin: 0 0 .75em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -9999px; top: 0; background: var(--surface); padding: 8px 12px; z-index: 10; }
.skip:focus { left: 8px; top: 8px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); } .small { font-size: .875rem; }

/* ------------------------------------------------------------------ header */
.banner { background: var(--warn-bg); color: var(--warn); font-size: .875rem; border-bottom: 1px solid var(--border); }
.banner .wrap { padding-top: 6px; padding-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.banner strong { font-weight: 600; }
.storage-warning { background: var(--bad-bg); color: var(--bad); font-size: .875rem; }
.storage-warning .wrap { padding-top: 6px; padding-bottom: 6px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
@media (max-width: 700px) { header.top { position: static; } }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 700; font-size: 1.1rem; margin-right: auto; white-space: nowrap; text-decoration: none; color: var(--text); }
.search { flex: 1 1 320px; display: flex; gap: 6px; order: 3; min-width: 0; }
.search input { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; order: 2; }
nav.tabs a { text-decoration: none; color: var(--text-2); padding: 6px 10px; border-radius: 6px; font-size: .95rem; }
nav.tabs a[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
nav.tabs a:hover { background: var(--surface-2); }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }

/* ------------------------------------------------------------------ buttons, badges, chips */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border);
  background: var(--surface); border-radius: 6px; cursor: pointer; text-decoration: none; color: var(--text); font-size: .9rem; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.btn.small { padding: 3px 8px; font-size: .8rem; }
.linklike { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.badge { display: inline-block; font-size: .78rem; line-height: 1.2; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.badge.jo-yes { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.jo-no { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.badge.lang { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.badge.unof-reported, .badge.unof-manual { background: var(--unof-bg); color: var(--unof); border-color: var(--unof-border); }
.badge.unof-likely { background: var(--unof-bg); color: var(--unof); border-color: var(--unof-border); border-style: dashed; }
.badge.unof-possible { background: transparent; color: var(--unof); border-color: var(--unof-border); border-style: dotted; }
.badge.unof-none { background: transparent; }
.badge.tag { background: var(--surface); }
.badge.hidden-b { background: var(--surface-2); color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 999px;
  background: var(--accent-bg); color: var(--accent); font-size: .85rem; }
.chip button { background: none; border: 0; cursor: pointer; color: inherit; padding: 0 6px; font-size: 1rem; line-height: 1; }

/* ------------------------------------------------------------------ browse layout */
main { padding: 16px 0 48px; }
.browse { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .browse { grid-template-columns: 280px 1fr; } }
.filters { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 12px 12px; align-self: start; }
.filters > summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
.facet { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.facet h3 { font-size: .9rem; margin-bottom: 4px; }
.facet ul { list-style: none; margin: 0; padding: 0; max-height: 15em; overflow-y: auto; }
.facet li label { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; cursor: pointer; font-size: .9rem; }
.facet li label .n { margin-left: auto; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.facet li.zero label { color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
.toolbar .count { font-weight: 600; margin-right: auto; }
.toolbar label { font-size: .9rem; display: inline-flex; gap: 6px; align-items: center; }
.toolbar select { padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

/* ------------------------------------------------------------------ cards */
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
  display: flex; gap: 12px; box-shadow: var(--shadow); }
.card.is-hidden { opacity: .6; }
.card-main { flex: 1; min-width: 0; }
.card-title { font-weight: 600; font-size: 1.05rem; text-decoration: none; }
.card-title:hover { text-decoration: underline; }
.card .meta { color: var(--text-2); font-size: .9rem; }
.card .alt-title { color: var(--muted); font-size: .85rem; }
.card .snippet { font-size: .85rem; color: var(--text-2); margin-top: 4px; overflow-wrap: anywhere; }
.card-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.star { font-size: 1.1rem; }
.star[aria-pressed="true"] { color: #c98500; }
@media (max-width: 560px) {
  .card { flex-direction: column; }
  .card-actions { flex-direction: row; flex-wrap: wrap; }
}

/* ------------------------------------------------------------------ detail */
.detail-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-bottom: 12px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.panel > h3 { margin-bottom: 12px; }
dl.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 4px 16px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: .9rem; }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) { dl.kv { grid-template-columns: 1fr; } dl.kv dd { margin-bottom: 6px; } }
details.section { border-top: 1px solid var(--border); padding: 8px 0; }
details.section > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.text { overflow-wrap: anywhere; }
.text.clamp { max-height: 16em; overflow: hidden; position: relative; }
.text.clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4em;
  background: linear-gradient(transparent, var(--surface)); }
pre.raw { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .85rem; background: var(--surface-2); padding: 12px; border-radius: 6px; max-height: 70vh; overflow: auto; }
table.lang { border-collapse: collapse; font-size: .9rem; margin: 6px 0 10px; }
table.lang th, table.lang td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.table-scroll { overflow-x: auto; }
.mine textarea { width: 100%; min-height: 6em; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); resize: vertical; }
.mine .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.mine input[type=text] { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); min-width: 0; }
.notice { padding: 10px 12px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); margin-bottom: 8px; }

/* unofficial section: visually distinct from the official JO */
.unofficial { background: var(--unof-bg); border: 2px dashed var(--unof-border); }
.unofficial > h3 { color: var(--unof); }
.entry { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 12px; }
.entry .reasons { margin: 6px 0 10px; padding-left: 1.2em; font-size: .9rem; color: var(--text-2); }
.entry .warn { background: var(--warn-bg); color: var(--warn); padding: 6px 10px; border-radius: 6px; font-size: .9rem; margin: 6px 0; }
.entry .note { font-size: .85rem; color: var(--muted); margin: 4px 0; }

/* ------------------------------------------------------------------ shortlist */
.ranklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rank-item { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; }
.rank-item.dragging { opacity: .4; }
.rank-item.drop-before { box-shadow: 0 -3px 0 var(--focus); }
.rank-item.drop-after { box-shadow: 0 3px 0 var(--focus); }
.rank-num { font-weight: 700; font-size: 1.2rem; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.handle { cursor: grab; color: var(--muted); user-select: none; padding: 0 4px; }
.rank-body { flex: 1; min-width: 0; }
.rank-actions { display: flex; gap: 4px; flex-wrap: wrap; }

/* ------------------------------------------------------------------ compare */
.compare-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; table-layout: fixed; }
.compare-table th, .compare-table td { vertical-align: top; text-align: left; padding: 10px; border-bottom: 1px solid var(--border); background: var(--surface); }
.compare-table th[scope=row] { width: 150px; color: var(--muted); font-weight: 600; font-size: .9rem; position: sticky; left: 0; z-index: 1; }
.compare-table thead th { position: sticky; top: 0; z-index: 2; }
.compare-table td .text { font-size: .9rem; max-height: 22em; overflow: auto; }

/* ------------------------------------------------------------------ overview */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.tile .big { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .lbl { color: var(--text-2); font-size: .9rem; }
.charts { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .charts { grid-template-columns: 1fr 1fr; } }
.bars { list-style: none; margin: 0; padding: 0; }
.bars li a { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 3ch; gap: 8px; align-items: center;
  text-decoration: none; color: var(--text); padding: 3px 4px; border-radius: 4px; font-size: .9rem; }
.bars li a:hover { background: var(--surface-2); }
.bars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { height: 12px; }
.bars .fill { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }

/* ------------------------------------------------------------------ misc */
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 16px; border-radius: 6px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
.help h3 { margin-top: 1.2em; }
.help dt { font-weight: 600; margin-top: .5em; }
.help dd { margin-left: 0; color: var(--text-2); }
footer { color: var(--muted); font-size: .85rem; padding: 24px 0; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<div class="banner" role="note"><div class="wrap">
  <span><strong>Unofficial tool.</strong> Data may contain errors — always verify against the original JO on Inspira.</span>
  <span id="buildDate"></span>
</div></div>
<div class="storage-warning" id="storageWarning" hidden><div class="wrap">
  Your browser is blocking local storage for this file, so stars, notes and tags will not be kept after you close it.
  Use “Export backup” on the Shortlist page to save them.
</div></div>
<header class="top"><div class="wrap">
  <a class="brand" href="#v=browse">MRP 2026 Explorer</a>
  <nav class="tabs" aria-label="Views" id="tabs"></nav>
  <div class="search" role="search">
    <label for="q" class="sr-only">Search all posts</label>
    <input id="q" type="search" placeholder="Search titles, JO text, unofficial descriptions…  (press /)" autocomplete="off">
    <button class="icon-btn" id="themeBtn" type="button" title="Switch between system, light and dark mode">Theme</button>
  </div>
</div></header>
<main id="app" tabindex="-1"><div class="wrap" id="view"></div></main>
<footer><div class="wrap" id="footer"></div></footer>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================================================
   DATA — inserted by scripts/build.py. Shape: {built, posts: [...], shared_not_in_compendium: [...]}
   ===================================================================================================== */
const DATA = /*__DATA__*/null;
const POSTS = DATA.posts;
const BY_ID = Object.fromEntries(POSTS.map(p => [p.mjo_number, p]));

/* =====================================================================================================
   PERSONAL DATA — localStorage only, keyed by MJO number so it carries over to new versions of this file.
   ===================================================================================================== */
const STORE_KEY = 'mrp2026-explorer:personal:v1';
const UI_KEY = 'mrp2026-explorer:ui:v1';
let storageOK = true;
function emptyMe() { return { rank: [], notes: {}, hidden: {}, tags: {}, compare: [] }; }
function loadMe() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    localStorage.setItem(STORE_KEY + ':test', '1'); localStorage.removeItem(STORE_KEY + ':test');
    return normaliseMe(raw ? JSON.parse(raw) : {});
  } catch (e) { storageOK = false; return emptyMe(); }
}
function normaliseMe(m) {
  const e = emptyMe();
  if (!m || typeof m !== 'object') return e;
  e.rank = Array.isArray(m.rank) ? m.rank.filter(x => typeof x === 'string') : [];
  for (const k of ['notes', 'hidden', 'tags']) if (m[k] && typeof m[k] === 'object') e[k] = m[k];
  e.compare = Array.isArray(m.compare) ? m.compare.filter(x => typeof x === 'string').slice(0, 3) : [];
  return e;
}
let ME = loadMe();
function saveMe() { try { localStorage.setItem(STORE_KEY, JSON.stringify(ME)); } catch (e) { storageOK = false; } }
function loadUI() { try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; } }
function saveUI(u) { try { localStorage.setItem(UI_KEY, JSON.stringify(u)); } catch (e) {} }

const isStarred = id => ME.rank.includes(id);
const isHidden = id => !!ME.hidden[id];
const tagsOf = id => ME.tags[id] || [];
function toggleStar(id) {
  if (isStarred(id)) ME.rank = ME.rank.filter(x => x !== id); else ME.rank.push(id);
  saveMe(); toast(isStarred(id) ? 'Added to shortlist' : 'Removed from shortlist');
}
function toggleHidden(id) {
  if (isHidden(id)) delete ME.hidden[id]; else ME.hidden[id] = true;
  saveMe(); toast(isHidden(id) ? 'Marked “Not for me” (hidden)' : 'Shown again');
}
function toggleCompare(id) {
  if (ME.compare.includes(id)) ME.compare = ME.compare.filter(x => x !== id);
  else if (ME.compare.length >= 3) { toast('Compare holds up to 3 posts — remove one first'); return; }
  else ME.compare.push(id);
  saveMe(); toast(`Compare: ${ME.compare.length} of 3 selected`);
}
function allTags() { return [...new Set(Object.values(ME.tags).flat())].sort((a, b) => a.localeCompare(b)); }

/* =====================================================================================================
   HELPERS
   ===================================================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/** Escape, highlight search terms, and turn blank lines into paragraphs. */
function fmt(text, terms) {
  if (text == null || text === '') return '';
  let h = hl(text, terms);
  h = h.split(/\n\s*\n/).map(par => `<p>${par.replace(/\n/g, '<br>')}</p>`).join('');
  return h;
}
/** Escape and wrap search terms in <mark>. */
function hl(text, terms) {
  let h = esc(text);
  if (terms && terms.length) {
    const re = new RegExp('(' + terms.map(t => reEsc(esc(t))).join('|') + ')', 'gi');
    h = h.replace(re, '<mark>$1</mark>');
  }
  return h;
}

/* =====================================================================================================
   LABELS
   ===================================================================================================== */
const UNOF_LEVELS = ['reported', 'manual', 'likely', 'possible', 'none'];
const UNOF_FILTER_LABEL = { reported: 'Reported by post holder', manual: 'Matched manually', likely: 'Likely match',
  possible: 'Possible match', none: 'None' };
function unofBadge(p) {
  const lvl = p.unofficial_best, n = p.unofficial.length;
  const txt = { reported: 'Unofficial: reported', manual: 'Unofficial: matched manually', likely: 'Unofficial: likely',
    possible: `Unofficial: possible (${n})`, none: 'Unofficial: none' }[lvl];
  const tip = lvl === 'none' ? 'No post-sharing entry seems to describe this post'
    : `${n} unofficial post-sharing ${n === 1 ? 'entry' : 'entries'} could describe this post — never confirmed`;
  return `<span class="badge unof-${lvl}" title="${esc(tip)}">${esc(txt)}</span>`;
}
function badges(p) {
  let h = p.has_full_jo ? '<span class="badge jo-yes">Full JO</span>' : '<span class="badge jo-no">Full JO not yet added</span>';
  h += unofBadge(p);
  for (const l of p.required_languages_other) h += `<span class="badge lang">${esc(l)} required</span>`;
  for (const t of tagsOf(p.mjo_number)) h += `<span class="badge tag">#${esc(t)}</span>`;
  if (isHidden(p.mjo_number)) h += '<span class="badge hidden-b">Hidden (not for me)</span>';
  return `<div class="badges">${h}</div>`;
}

/* =====================================================================================================
   SEARCH INDEX — every field of a post, JO text and unofficial descriptions included.
   ===================================================================================================== */
const JO_SECTIONS = [  // official JO sections, always shown in this order
  ['org_setting_and_reporting', 'Org. setting and reporting'],
  ['responsibilities', 'Responsibilities'],
  ['competencies', 'Competencies'],
  ['education', 'Education'],
  ['experience', 'Experience'],
];
const ENTRY_FIELDS = [  // unofficial entry fields, in display order
  ['unit', 'Unit / division'], ['mjo_text', 'MJO number as written in the sheet'],
  ['participation', 'Likelihood of participating in the MRP'], ['relocation', 'Potential relocation'],
  ['duties', 'Duties'], ['team_composition', 'Team composition'],
  ['duty_station_assessment', 'Duty station assessment'], ['comments', 'Comments'],
  ['name', 'Name'], ['email', 'Email'],
];
function searchFields(p) {
  const f = [['MJO', p.mjo_number], ['Title', p.display_title], ['Compendium title', p.title_compendium],
    ['Entity', p.entity], ['Duty station', p.duty_station], ['Job network', p.job_network], ['Job family', p.job_family]];
  const j = p.jo;
  if (j) {
    f.push(['Department', j.department]);
    for (const [k, l] of JO_SECTIONS) f.push([l, j[k]]);
    f.push(['Eligibility', j.eligibility], ['Languages', (j.languages.required || []).map(x => x.language).join(' ')],
      ['Language requirement', j.languages.sentence], ['Career development', j.career_development], ['YPP conditions', j.ypp_conditions]);
  }
  for (const e of p.unofficial) for (const [k, l] of ENTRY_FIELDS.concat([['title', 'Title in the sheet']])) f.push(['Unofficial · ' + l, e[k]]);
  f.push(['My notes', ME.notes[p.mjo_number]], ['My tags', tagsOf(p.mjo_number).join(' ')]);
  return f.filter(x => x[1]);
}
function parseQuery(q) {
  const terms = [];
  (q || '').replace(/"([^"]+)"|(\S+)/g, (_, a, b) => { terms.push((a || b).toLowerCase()); });
  return terms.filter(Boolean);
}
function matchesQuery(p, terms) {
  if (!terms.length) return true;
  const text = (p._text ??= searchFields(p).map(x => x[1]).join('\n').toLowerCase());
  return terms.every(t => text.includes(t));
}
/** Short context around the first term hit outside the always-visible fields. */
function snippet(p, terms) {
  if (!terms.length) return '';
  const visible = new Set(['MJO', 'Title', 'Compendium title', 'Entity', 'Duty station', 'Job network', 'Job family']);
  for (const [label, val] of searchFields(p)) {
    if (visible.has(label)) continue;
    const low = val.toLowerCase();
    for (const t of terms) {
      const i = low.indexOf(t);
      if (i >= 0) {
        const s = Math.max(0, i - 70), e = Math.min(val.length, i + t.length + 90);
        const piece = (s ? '…' : '') + val.slice(s, e).replace(/\s+/g, ' ') + (e < val.length ? '…' : '');
        return `<div class="snippet"><span class="muted">${esc(label)}:</span> ${hl(piece, terms)}</div>`;
      }
    }
  }
  return '';
}

/* =====================================================================================================
   FILTERS (facets) — OR within a facet, AND across facets.
   ===================================================================================================== */
const FACETS = [
  { key: 'ds', label: 'Duty station', get: p => [p.duty_station] },
  { key: 'ent', label: 'Entity', get: p => [p.entity] },
  { key: 'net', label: 'Job network', get: p => [p.job_network] },
  { key: 'fam', label: 'Job family', get: p => [p.job_family] },
  { key: 'lang', label: 'Required language (beyond English)',
    get: p => p.required_languages_other.length ? p.required_languages_other : ['None (English only)'] },
  { key: 'jo', label: 'Full JO', get: p => [p.has_full_jo ? 'Available' : 'Not yet added'] },
  { key: 'unof', label: 'Unofficial description', get: p => [UNOF_FILTER_LABEL[p.unofficial_best]],
    order: UNOF_LEVELS.map(l => UNOF_FILTER_LABEL[l]) },
  { key: 'tag', label: 'My tags', get: p => tagsOf(p.mjo_number), personal: true },
];
const SORTS = {
  title: ['Title', (a, b) => a.display_title.localeCompare(b.display_title)],
  ds: ['Duty station', (a, b) => a.duty_station.localeCompare(b.duty_station) || a.display_title.localeCompare(b.display_title)],
  ent: ['Entity', (a, b) => a.entity.localeCompare(b.entity) || a.display_title.localeCompare(b.display_title)],
  fam: ['Job family', (a, b) => a.job_family.localeCompare(b.job_family) || a.display_title.localeCompare(b.display_title)],
  mjo: ['MJO number', (a, b) => a.mjo_number.localeCompare(b.mjo_number)],
  rank: ['My ranking', (a, b) => rankOf(a) - rankOf(b) || a.display_title.localeCompare(b.display_title)],
};
const rankOf = p => { const i = ME.rank.indexOf(p.mjo_number); return i < 0 ? 1e9 : i; };

/* =====================================================================================================
   STATE <-> URL HASH  (so views can be bookmarked; personal data is never put in the URL)
   ===================================================================================================== */
let S = {};
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  S = { v: h.get('v') || 'browse', q: h.get('q') || '', sort: SORTS[h.get('sort')] ? h.get('sort') : 'title',
    showHidden: h.get('hidden') === '1', starredOnly: h.get('starred') === '1', post: h.get('post'), f: {} };
  for (const fc of FACETS) S.f[fc.key] = h.get(fc.key) ? h.get(fc.key).split('|') : [];
  if (S.v === 'post' && !BY_ID[S.post]) S.v = 'browse';
}
function hashFor(over = {}) {
  const st = Object.assign({}, S, over), h = new URLSearchParams();
  h.set('v', st.v);
  if (st.q) h.set('q', st.q);
  for (const fc of FACETS) if ((st.f[fc.key] || []).length) h.set(fc.key, st.f[fc.key].join('|'));
  if (st.sort !== 'title') h.set('sort', st.sort);
  if (st.showHidden) h.set('hidden', '1');
  if (st.starredOnly) h.set('starred', '1');
  if (st.v === 'post' && st.post) h.set('post', st.post);
  return '#' + h.toString();
}
/** Update the URL without adding a history entry (typing, ticking filters). */
function replaceHash() { history.replaceState(null, '', hashFor()); }
function go(over) { location.hash = hashFor(over); }

/* =====================================================================================================
   RESULTS
   ===================================================================================================== */
function filtered(skipFacet) {
  const terms = parseQuery(S.q);
  return POSTS.filter(p => {
    if (!S.showHidden && isHidden(p.mjo_number)) return false;
    if (S.starredOnly && !isStarred(p.mjo_number)) return false;
    for (const fc of FACETS) {
      if (fc.key === skipFacet) continue;
      const sel = S.f[fc.key];
      if (sel.length && !fc.get(p).some(v => sel.includes(v))) return false;
    }
    return matchesQuery(p, terms);
  });
}
function results() { return filtered().sort(SORTS[S.sort][1]); }
function activeFilterCount() { return FACETS.reduce((n, f) => n + S.f[f.key].length, 0) + (S.q ? 1 : 0) + (S.starredOnly ? 1 : 0); }

/* =====================================================================================================
   RENDERING
   ===================================================================================================== */
const VIEWS = [['browse', 'Browse'], ['overview', 'Overview'], ['shortlist', 'Shortlist'], ['compare', 'Compare'],
  ['shared', 'Not in compendium'], ['help', 'Help']];
function renderTabs() {
  const cur = S.v === 'post' ? 'browse' : S.v;
  $('#tabs').innerHTML = VIEWS.map(([v, l]) => {
    let label = l;
    if (v === 'shortlist') label += ` (${ME.rank.filter(id => BY_ID[id]).length})`;
    if (v === 'compare') label += ` (${ME.compare.length})`;
    if (v === 'shared') label += ` (${DATA.shared_not_in_compendium.length})`;
    return `<a href="${hashFor({ v, post: null })}" ${v === cur ? 'aria-current="page"' : ''}>${esc(label)}</a>`;
  }).join('');
}
function render() {
  // keep keyboard focus on the same control across re-renders
  const focusId = document.activeElement && document.activeElement.id;
  renderTabs();
  const qi = $('#q'); if (qi.value !== S.q && document.activeElement !== qi) qi.value = S.q;
  const fn = { browse: renderBrowse, post: renderPost, overview: renderOverview, shortlist: renderShortlist,
    compare: renderCompare, shared: renderShared, help: renderHelp }[S.v] || renderBrowse;
  $('#view').innerHTML = fn();
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
  afterRender();
}

/* ---------------------------------------------------------------- browse */
function renderBrowse() {
  const list = results(), terms = parseQuery(S.q);
  const hiddenCount = Object.keys(ME.hidden).filter(id => BY_ID[id]).length;
  let facets = '';
  for (const fc of FACETS) {
    const all = new Map();
    for (const p of POSTS) for (const v of fc.get(p)) all.set(v, 0);
    if (fc.personal && !all.size) continue;
    for (const p of filtered(fc.key)) for (const v of fc.get(p)) all.set(v, (all.get(v) || 0) + 1);
    let vals = [...all.keys()];
    vals.sort(fc.order ? (a, b) => fc.order.indexOf(a) - fc.order.indexOf(b) : (a, b) => a.localeCompare(b));
    facets += `<fieldset class="facet" style="border:0;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--border)">
      <legend class="sr-only">${esc(fc.label)}</legend><h3 aria-hidden="true">${esc(fc.label)}</h3><ul>` +
      vals.map(v => {
        const id = `f-${fc.key}-${v.replace(/[^A-Za-z0-9]/g, '_')}`, n = all.get(v), on = S.f[fc.key].includes(v);
        return `<li class="${n || on ? '' : 'zero'}"><label for="${id}"><input type="checkbox" id="${id}" data-facet="${fc.key}"
          value="${esc(v)}" ${on ? 'checked' : ''}><span>${esc(v)}</span><span class="n">${n}</span></label></li>`;
      }).join('') + '</ul></fieldset>';
  }
  const chips = [];
  if (S.q) chips.push(`<span class="chip">Search: “${esc(S.q)}”<button data-act="clear-q" aria-label="Remove search">×</button></span>`);
  for (const fc of FACETS) for (const v of S.f[fc.key])
    chips.push(`<span class="chip">${esc(fc.label)}: ${esc(v)}<button data-act="unfacet" data-facet="${fc.key}" data-value="${esc(v)}" aria-label="Remove filter ${esc(v)}">×</button></span>`);
  if (S.starredOnly) chips.push(`<span class="chip">Shortlisted only<button data-act="unstarred" aria-label="Remove shortlisted-only filter">×</button></span>`);

  return `<div class="browse">
    <details class="filters" id="filterPanel" ${filtersOpen() ? 'open' : ''}>
      <summary>Filters${activeFilterCount() ? ` (${activeFilterCount()} active)` : ''}</summary>
      ${facets}
    </details>
    <section aria-label="Results">
      <div class="toolbar">
        <span class="count" id="count">${list.length} of ${POSTS.length} posts</span>
        <label>Sort by <select id="sort">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}" ${k === S.sort ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label><input type="checkbox" id="starredOnly" ${S.starredOnly ? 'checked' : ''}> Shortlisted only</label>
        <label><input type="checkbox" id="showHidden" ${S.showHidden ? 'checked' : ''}> Show hidden (${hiddenCount})</label>
        ${activeFilterCount() ? '<button class="btn small" data-act="clear-all">Clear all</button>' : ''}
      </div>
      ${chips.length ? `<div class="active-filters">${chips.join('')}</div>` : ''}
      ${list.length ? `<ul class="cards">${list.map(p => card(p, terms)).join('')}</ul>`
        : '<div class="empty">No posts match. Try removing a filter or <button class="linklike" data-act="clear-all">clear all</button>.</div>'}
    </section></div>`;
}
let filtersOpenState = null;
function filtersOpen() { return filtersOpenState ?? window.matchMedia('(min-width: 900px)').matches; }
function card(p, terms) {
  const id = p.mjo_number;
  return `<li class="card ${isHidden(id) ? 'is-hidden' : ''}">
    <div class="card-main">
      <a class="card-title" href="${hashFor({ v: 'post', post: id })}">${hl(p.display_title, terms)}</a>
      ${p.title_differs ? `<div class="alt-title">Compendium title: ${hl(p.title_compendium, terms)}</div>` : ''}
      <div class="meta">${hl(id, terms)} · ${hl(p.entity, terms)} · ${hl(p.duty_station, terms)} · ${hl(p.job_network, terms)} / ${hl(p.job_family, terms)}</div>
      ${badges(p)}${snippet(p, terms)}
    </div>
    ${actionButtons(id, true)}
  </li>`;
}
function actionButtons(id, compact) {
  const st = isStarred(id), cmp = ME.compare.includes(id), hid = isHidden(id);
  return `<div class="${compact ? 'card-actions' : 'row'}">
    <button class="btn small star" data-act="star" data-id="${id}" aria-pressed="${st}">${st ? '★' : '☆'} ${st ? 'Shortlisted' : 'Shortlist'}</button>
    <button class="btn small" data-act="compare" data-id="${id}" aria-pressed="${cmp}">${cmp ? '✓ Comparing' : 'Compare'}</button>
    <button class="btn small" data-act="hide" data-id="${id}" aria-pressed="${hid}">${hid ? 'Unhide' : 'Not for me'}</button>
  </div>`;
}

/* ---------------------------------------------------------------- post detail */
function renderPost() {
  const p = BY_ID[S.post], j = p.jo, terms = parseQuery(S.q), id = p.mjo_number;
  const list = results(), i = list.findIndex(x => x.mjo_number === id);
  const prev = i > 0 ? list[i - 1] : null, next = i >= 0 && i < list.length - 1 ? list[i + 1] : null;
  const kv = [['MJO number', id], ['Title (official, from JO)', j ? j.title_full : null],
    ['Compendium title', p.title_compendium + (p.title_differs ? ' — differs from the JO title' : '')],
    ['Entity', p.entity], ['Department', j && j.department], ['Duty station', p.duty_station], ['Level', p.level],
    ['Job network', p.job_network], ['Job family', p.job_family], ['YPP exercise', j && j.ypp_exercise],
    ['Reports to', j && j.reports_to_snippet]];
  return `
  <div class="detail-nav">
    <a class="btn" href="${hashFor({ v: 'browse', post: null })}">← Back to results</a>
    <span>${prev ? `<a class="btn" href="${hashFor({ post: prev.mjo_number })}">‹ Previous</a>` : ''}
      ${next ? `<a class="btn" href="${hashFor({ post: next.mjo_number })}">Next ›</a>` : ''}</span>
  </div>
  <article>
    <h2 id="postTitle" tabindex="-1">${hl(p.display_title, terms)}</h2>
    ${badges(p)}
    <p class="small"><a href="#h-unof" data-act="jump">Jump to the unofficial post-holder information ↓</a></p>
    <section class="panel" aria-labelledby="h-comp"><h3 id="h-comp">Post information</h3>
      <dl class="kv">${kv.filter(x => x[1]).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${hl(v, terms)}</dd>`).join('')}</dl>
    </section>
    ${minePanel(id)}
    ${officialPanel(p, terms)}
    ${unofficialPanel(p, terms)}
  </article>`;
}
function minePanel(id) {
  const tags = tagsOf(id);
  return `<section class="panel mine" aria-labelledby="h-mine"><h3 id="h-mine">My notes <span class="muted small">(private — stored only in this browser)</span></h3>
    ${actionButtons(id, false)}
    <div class="row"><span>Tags:</span>
      ${tags.map(t => `<span class="chip">#${esc(t)}<button data-act="untag" data-id="${id}" data-tag="${esc(t)}" aria-label="Remove tag ${esc(t)}">×</button></span>`).join('') || '<span class="muted small">none</span>'}
      <label for="tagInput" class="sr-only">Add a tag</label>
      <input type="text" id="tagInput" list="tagList" placeholder="Add a tag, e.g. top-3" data-id="${id}">
      <datalist id="tagList">${allTags().map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      <button class="btn small" data-act="addtag" data-id="${id}">Add tag</button>
    </div>
    <label for="notes" class="sr-only">Private notes</label>
    <textarea id="notes" data-id="${id}" placeholder="Private notes about this post (saved automatically)">${esc(ME.notes[id] || '')}</textarea>
    <div class="small muted" id="notesStatus" aria-live="polite"></div>
  </section>`;
}
const CLAMP_AT = 1400;  // characters; longer sections are collapsed to a preview
function textBlock(text, terms, key) {
  if (!text) return '<p class="muted">Not stated in the JO text.</p>';
  const clamp = text.length > CLAMP_AT && !terms.length;
  return `<div class="text ${clamp ? 'clamp' : ''}" id="tx-${key}">${fmt(text, terms)}</div>
    ${clamp ? `<button class="btn small" data-act="unclamp" data-target="tx-${key}" aria-expanded="false">Show full section</button>` : ''}`;
}
function officialPanel(p, terms) {
  const j = p.jo;
  if (!j) return `<section class="panel" aria-labelledby="h-off"><h3 id="h-off">Official job opening</h3>
    <div class="notice"><strong>Full JO not yet added.</strong> Only the compendium information above is available for this post. Check Inspira.</div></section>`;
  let h = '';
  for (const [k, l] of JO_SECTIONS) h += `<details class="section" open><summary>${l}</summary>${textBlock(j[k], terms, k)}</details>`;
  const req = j.languages.required || [];
  h += `<details class="section" open><summary>Languages</summary>
    ${req.length ? `<div class="table-scroll"><table class="lang"><caption class="sr-only">Required languages</caption>
      <thead><tr><th scope="col">Required language</th><th scope="col">Reading</th><th scope="col">Writing</th><th scope="col">Listening</th><th scope="col">Speaking</th></tr></thead>
      <tbody>${req.map(r => `<tr><th scope="row">${hl(r.language, terms)}</th><td>${esc(r.reading)}</td><td>${esc(r.writing)}</td><td>${esc(r.listening)}</td><td>${esc(r.speaking)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${j.languages.sentence ? `<div class="text">${fmt(j.languages.sentence, terms)}</div>` : ''}
    ${j.languages_note ? `<div class="text small muted">${fmt(j.languages_note, terms)}</div>` : ''}
  </details>`;
  h += `<details class="section"><summary>Full eligibility text (as written in the JO)</summary>${textBlock(j.eligibility, terms, 'elig')}</details>`;
  if (j.career_development) h += `<details class="section" open><summary>Career development</summary>${textBlock(j.career_development, terms, 'cd')}</details>`;
  if (j.ypp_conditions) h += `<details class="section" open><summary>YPP conditions</summary>${textBlock(j.ypp_conditions, terms, 'ypp')}</details>`;
  h += `<details class="section"><summary>Raw JO text (exactly as copied from Inspira)</summary><pre class="raw">${hl(j.raw_text, terms)}</pre></details>`;
  return `<section class="panel" aria-labelledby="h-off"><h3 id="h-off">Official job opening (from Inspira)</h3>${h}</section>`;
}
function entryHtml(e, terms, withConfidence) {
  let h = '<article class="entry">';
  if (withConfidence) {
    h += `<div><span class="badge unof-${e.confidence}">${esc(e.confidence_label)}</span></div>
      <ul class="reasons">${(e.reasons || []).map(r => `<li>${esc(r)}</li>`).join('')}</ul>`;
  }
  for (const n of e.notes || []) {
    const warn = /may not be participating/.test(n);
    h += `<div class="${warn ? 'warn' : 'note'}">${warn ? '⚠ ' : ''}${esc(n)}</div>`;
  }
  h += `<p class="small muted">As listed in the sheet: ${esc([e.title, e.entity, e.duty_station, e.job_network].filter(Boolean).join(' · '))}</p>`;
  h += '<dl class="kv">' + ENTRY_FIELDS.filter(([k]) => e[k]).map(([k, l]) => {
    const v = k === 'email' ? `<a href="mailto:${esc(e[k])}">${hl(e[k], terms)}</a>` : fmt(e[k], terms);
    return `<dt>${esc(l)}</dt><dd>${v}</dd>`;
  }).join('') + '</dl></article>';
  return h;
}
function unofficialPanel(p, terms) {
  const list = p.unofficial;
  return `<section class="panel unofficial" aria-labelledby="h-unof">
    <h3 id="h-unof">Unofficial — written by the current post holder</h3>
    <p class="small">From the crowd-sourced post-sharing sheet. Not verified. The link between an entry and this post is never certain: read the confidence level and reason first.</p>
    ${list.length ? (list.length > 1 ? `<p class="small"><strong>${list.length} entries</strong> could describe this post; each is labelled separately.</p>` : '') +
      list.map(e => entryHtml(e, terms, true)).join('')
      : '<p class="muted">No post-sharing entry seems to describe this post.</p>'}
  </section>`;
}

/* ---------------------------------------------------------------- overview dashboard */
function bars(title, facetKey, counts) {
  const max = Math.max(1, ...counts.map(c => c[1]));
  return `<section class="panel"><h3>${esc(title)}</h3><ul class="bars">` + counts.map(([k, n]) => {
    const href = facetKey ? hashFor({ v: 'browse', post: null, q: '', starredOnly: false,
      f: Object.fromEntries(FACETS.map(f => [f.key, f.key === facetKey ? [k] : []])) }) : '#';
    return `<li><a href="${href}" title="${esc(k)}: ${n} post${n === 1 ? '' : 's'} — show them">
      <span class="lbl">${esc(k)}</span><span class="track"><span class="fill" style="width:${(n / max * 100).toFixed(1)}%"></span></span><span class="val">${n}</span></a></li>`;
  }).join('') + '</ul></section>';
}
function countBy(get) {
  const m = new Map();
  for (const p of POSTS) for (const v of get(p)) m.set(v, (m.get(v) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function renderOverview() {
  const fc = k => FACETS.find(f => f.key === k);
  const withJo = POSTS.filter(p => p.has_full_jo).length;
  const withUnof = POSTS.filter(p => p.unofficial.length).length;
  const nonEn = POSTS.filter(p => p.required_languages_other.length).length;
  const unofCounts = UNOF_LEVELS.map(l => [UNOF_FILTER_LABEL[l], POSTS.filter(p => p.unofficial_best === l).length]).filter(x => x[1] || x[0] !== 'Matched manually');
  return `<h2>Overview</h2>
  <p class="muted">Click any bar to see those posts. Data built ${esc(DATA.built)}.</p>
  <div class="tiles">
    <div class="tile"><div class="big">${POSTS.length}</div><div class="lbl">posts in the compendium (all P2)</div></div>
    <div class="tile"><div class="big">${withJo}</div><div class="lbl">with the full JO text${withJo < POSTS.length ? ` (${POSTS.length - withJo} not yet added)` : ''}</div></div>
    <div class="tile"><div class="big">${withUnof}</div><div class="lbl">with at least one unofficial description (any confidence)</div></div>
    <div class="tile"><div class="big">${nonEn}</div><div class="lbl">require a language other than English</div></div>
    <div class="tile"><div class="big">${DATA.shared_not_in_compendium.length}</div><div class="lbl">shared posts not in the compendium</div></div>
  </div>
  <div class="charts">
    ${bars('Unofficial description — best confidence per post', 'unof', unofCounts)}
    ${bars('Full JO', 'jo', countBy(fc('jo').get))}
    ${bars('Duty station', 'ds', countBy(fc('ds').get))}
    ${bars('Job network', 'net', countBy(fc('net').get))}
    ${bars('Required language (beyond English)', 'lang', countBy(fc('lang').get))}
    ${bars('Job family', 'fam', countBy(fc('fam').get))}
    ${bars('Entity', 'ent', countBy(fc('ent').get))}
  </div>`;
}

/* ---------------------------------------------------------------- shortlist */
function renderShortlist() {
  const ids = ME.rank.filter(id => BY_ID[id]);
  const items = ids.map((id, i) => {
    const p = BY_ID[id], tags = tagsOf(id), note = ME.notes[id];
    return `<li class="rank-item" draggable="true" data-id="${id}">
      <span class="handle" aria-hidden="true" title="Drag to reorder">⋮⋮</span>
      <span class="rank-num">${i + 1}</span>
      <div class="rank-body">
        <a class="card-title" href="${hashFor({ v: 'post', post: id })}">${esc(p.display_title)}</a>
        <div class="meta small">${id} · ${esc(p.entity)} · ${esc(p.duty_station)}</div>
        ${tags.length ? `<div class="badges">${tags.map(t => `<span class="badge tag">#${esc(t)}</span>`).join('')}</div>` : ''}
        ${note ? `<div class="small muted">${esc(note.length > 160 ? note.slice(0, 160) + '…' : note)}</div>` : ''}
      </div>
      <div class="rank-actions">
        <button class="btn small" id="up-${id}" data-act="up" data-id="${id}" ${i ? '' : 'disabled'} aria-label="Move ${esc(p.display_title)} up">↑</button>
        <button class="btn small" id="down-${id}" data-act="down" data-id="${id}" ${i < ids.length - 1 ? '' : 'disabled'} aria-label="Move ${esc(p.display_title)} down">↓</button>
        <button class="btn small" data-act="star" data-id="${id}" aria-label="Remove ${esc(p.display_title)} from shortlist">Remove</button>
      </div></li>`;
  }).join('');
  return `<h2>My shortlist</h2>
  <p class="muted">Star posts with “Shortlist”. Drag to rank them (or use ↑ ↓). Your shortlist, notes, tags and hidden posts are stored only in this browser and are keyed by MJO number, so they carry over when you open a newer version of this file from the same place.</p>
  <div class="row" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <button class="btn" data-act="export-csv" ${ids.length ? '' : 'disabled'}>Export shortlist (CSV)</button>
    <button class="btn" data-act="export-json">Export backup (all my data, JSON)</button>
    <label class="btn" for="importFile">Import backup…</label>
    <input type="file" id="importFile" accept="application/json,.json" class="sr-only">
    ${ids.length > 1 ? `<a class="btn" href="${hashFor({ v: 'browse', post: null, starredOnly: true, sort: 'rank' })}">Browse shortlist</a>` : ''}
  </div>
  ${ids.length ? `<ol class="ranklist" id="ranklist" aria-label="Shortlist in ranked order">${items}</ol>`
    : '<div class="empty">Your shortlist is empty. Use “☆ Shortlist” on any post.</div>'}`;
}
function moveRank(id, delta) {
  const ids = ME.rank.filter(x => BY_ID[x]), i = ids.indexOf(id), j = i + delta;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  ME.rank = ids.concat(ME.rank.filter(x => !BY_ID[x]));  // keep ranks of posts not in this version
  saveMe();
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Rank', 'MJO number', 'Title', 'Duty station', 'Entity', 'Tags', 'Notes']];
  ME.rank.filter(id => BY_ID[id]).forEach((id, i) => {
    const p = BY_ID[id];
    rows.push([i + 1, id, p.display_title, p.duty_station, p.entity, tagsOf(id).join(', '), ME.notes[id] || '']);
  });
  download('mrp2026-shortlist.csv', '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function exportJSON() {
  const payload = { app: 'mrp2026-explorer', version: 1, exported: new Date().toISOString(), data: ME };
  download(`mrp2026-my-data-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(payload, null, 2), 'application/json');
}
function importJSON(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (!obj || obj.app !== 'mrp2026-explorer' || !obj.data) throw new Error('not a backup from this tool');
      const incoming = normaliseMe(obj.data);
      const msg = `Replace your current personal data (${ME.rank.length} shortlisted, ${Object.keys(ME.notes).length} notes) ` +
        `with the backup (${incoming.rank.length} shortlisted, ${Object.keys(incoming.notes).length} notes)?`;
      if (!confirm(msg)) return;
      ME = incoming; saveMe(); invalidateSearch(); render(); toast('Backup imported');
    } catch (e) { alert('Could not import this file: ' + e.message); }
  };
  r.readAsText(file);
}

/* ---------------------------------------------------------------- compare */
function renderCompare() {
  const ids = ME.compare.filter(id => BY_ID[id]);
  if (ids.length < 2) return `<h2>Compare posts</h2><div class="empty">Choose 2 or 3 posts with the “Compare” button (${ids.length} selected so far).
    ${ids.length ? `<p>Selected: ${ids.map(id => `<a href="${hashFor({ v: 'post', post: id })}">${esc(BY_ID[id].display_title)} (${id})</a>`).join(', ')}</p>` : ''}</div>`;
  const P = ids.map(id => BY_ID[id]);
  const row = (label, f) => `<tr><th scope="row">${esc(label)}</th>${P.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
  const jt = (p, k) => p.jo ? (p.jo[k] ? `<div class="text">${fmt(p.jo[k])}</div>` : '<span class="muted">Not stated</span>') : '<span class="muted">Full JO not yet added</span>';
  const unof = p => p.unofficial.length ? p.unofficial.map(e =>
    `<div style="margin-bottom:8px"><span class="badge unof-${e.confidence}">${esc(e.confidence_label)}</span>
     <div class="small">${esc([e.unit, e.team_composition && 'Team: ' + e.team_composition, e.duty_station_assessment && 'Duty station: ' + e.duty_station_assessment].filter(Boolean).join(' — '))}</div></div>`).join('')
    : '<span class="muted">None</span>';
  return `<h2>Compare posts</h2>
  <p class="muted">Sections are aligned row by row. Scroll sideways on small screens.</p>
  <div class="table-scroll"><table class="compare-table">
    <thead><tr><th scope="row"><span class="sr-only">Field</span></th>${P.map(p => `<th scope="col">
      <a href="${hashFor({ v: 'post', post: p.mjo_number })}">${esc(p.display_title)}</a>
      <div class="small muted">${p.mjo_number}</div>
      <button class="btn small" data-act="compare" data-id="${p.mjo_number}">Remove</button></th>`).join('')}</tr></thead>
    <tbody>
      ${row('Entity', p => esc(p.entity) + (p.jo ? `<div class="small muted">${esc(p.jo.department)}</div>` : ''))}
      ${row('Duty station', p => esc(p.duty_station))}
      ${row('Job network / family', p => esc(p.job_network + ' / ' + p.job_family))}
      ${row('Compendium title', p => esc(p.title_compendium))}
      ${row('Required languages', p => p.jo ? esc(p.jo.languages.required.map(l => l.language).join(', ')) : '<span class="muted">—</span>')}
      ${row('Reports to', p => p.jo && p.jo.reports_to_snippet ? esc(p.jo.reports_to_snippet) : '<span class="muted">—</span>')}
      ${row('Org. setting', p => jt(p, 'org_setting_and_reporting'))}
      ${row('Responsibilities', p => jt(p, 'responsibilities'))}
      ${row('Competencies', p => jt(p, 'competencies'))}
      ${row('Education', p => jt(p, 'education'))}
      ${row('Experience', p => jt(p, 'experience'))}
      ${row('Language requirement', p => p.jo && p.jo.languages.sentence ? esc(p.jo.languages.sentence) : '<span class="muted">—</span>')}
      ${row('Unofficial (post holder)', unof)}
      ${row('My tags', p => esc(tagsOf(p.mjo_number).map(t => '#' + t).join(' ')) || '<span class="muted">—</span>')}
      ${row('My notes', p => ME.notes[p.mjo_number] ? fmt(ME.notes[p.mjo_number]) : '<span class="muted">—</span>')}
    </tbody></table></div>`;
}

/* ---------------------------------------------------------------- shared posts not in the compendium */
function renderShared() {
  const L = DATA.shared_not_in_compendium, terms = parseQuery(S.q);
  return `<h2>Shared posts not in the compendium</h2>
  <p class="muted">Post-sharing entries that match none of the ${POSTS.length} compendium posts (different entity, duty station or title, or the holder says the post is not included). Kept here so the information isn't lost.</p>
  ${L.length ? `<div class="panel unofficial"><h3>Unofficial — written by the post holder</h3>${L.map(e => entryHtml(e, terms, false)).join('')}</div>`
    : '<div class="empty">None.</div>'}`;
}

/* ---------------------------------------------------------------- help */
function renderHelp() {
  return `<div class="panel help"><h2>About this tool</h2>
  <p>An unofficial, searchable view of the ${POSTS.length} mobility job openings (MJOs) in the 2026 YPP Managed Reassignment Programme. It combines the official compendium, the full JO texts copied from Inspira, and the crowd-sourced post-sharing sheet. <strong>Always verify against the original JO on Inspira.</strong> This version was built ${esc(DATA.built)}.</p>
  <h3>Badges</h3><dl>
    <dt>Full JO / Full JO not yet added</dt><dd>Whether the full job opening text is included. Without it, only the compendium line is shown.</dd>
    <dt>“French required” etc.</dt><dd>A language other than English in the JO's Required Languages table.</dd>
    <dt>Unofficial: reported / matched manually / likely / possible (N) / none</dt><dd>The best confidence level of the post-sharing entries that could describe this post. N is the number of entries attached to the post.</dd>
  </dl>
  <h3>Confidence levels (unofficial descriptions)</h3>
  <p>An entry in the post-sharing sheet is never treated as certainly belonging to a post.</p><dl>
    <dt>Reported by post holder</dt><dd>The entry gives exactly one MJO number, and its entity and duty station agree with the compendium.</dd>
    <dt>Matched manually</dt><dd>The tool's maintainer linked the entry to the post by hand. Still not an official confirmation.</dd>
    <dt>Likely match — unit matches JO</dt><dd>No (single) MJO number was given, but the entry's unit/division matches where this JO says the post sits, better than any other candidate.</dd>
    <dt>Possible match (1 of N)</dt><dd>The entry could describe any of N posts (several numbers given, or none, but entity + duty station + title fit N posts). It is shown on each of them.</dd>
    <dt>“Post holder may not be participating”</dt><dd>The holder said “Not participating” or “Requesting deferral”: the post may not be in the exercise. These are never above “Possible”.</dd>
  </dl>
  <h3>Your private data</h3>
  <p>Shortlist, ranking, notes, tags and “Not for me” are stored <strong>only in this browser</strong> (localStorage) — never in this file, never sent anywhere. They are keyed by MJO number, so when you get a newer version of this file and open it <strong>from the same folder with the same file name</strong> in the same browser, your data is still there. Other browsers, private windows or clearing site data will not have it.</p>
  <p>To be safe, use <strong>Shortlist → Export backup</strong> now and then, and <strong>Import backup</strong> to restore it (e.g. on another computer or browser).</p>
  <h3>Tips</h3>
  <ul><li>Press <kbd>/</kbd> to jump to search. Use quotes for phrases, e.g. <code>"social media"</code>. All words must match.</li>
  <li>The address bar keeps your search, filters and sort: bookmark it or share the link (personal data is never in the link).</li>
  <li>Tags you add appear as a “My tags” filter.</li></ul>
  </div>`;
}

/* =====================================================================================================
   EVENTS
   ===================================================================================================== */
function invalidateSearch() { for (const p of POSTS) delete p._text; }
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  switch (act) {
    case 'star': toggleStar(id); break;
    case 'hide': toggleHidden(id); break;
    case 'compare': toggleCompare(id); break;
    case 'clear-all': for (const f of FACETS) S.f[f.key] = []; S.q = ''; S.starredOnly = false; $('#q').value = ''; replaceHash(); break;
    case 'clear-q': S.q = ''; $('#q').value = ''; replaceHash(); break;
    case 'unfacet': S.f[b.dataset.facet] = S.f[b.dataset.facet].filter(v => v !== b.dataset.value); replaceHash(); break;
    case 'unstarred': S.starredOnly = false; replaceHash(); break;
    case 'addtag': addTag(id); return;
    case 'untag': ME.tags[id] = tagsOf(id).filter(t => t !== b.dataset.tag); if (!ME.tags[id].length) delete ME.tags[id]; saveMe(); invalidateSearch(); break;
    case 'unclamp': {
      const t = document.getElementById(b.dataset.target); t.classList.remove('clamp'); b.remove(); return;
    }
    case 'up': moveRank(id, -1); break;
    case 'down': moveRank(id, +1); break;
    case 'export-csv': exportCSV(); return;
    case 'export-json': exportJSON(); return;
    case 'jump': ev.preventDefault(); $('#h-unof').scrollIntoView(); return;
    default: return;
  }
  render();
});
function addTag(id) {
  const inp = $('#tagInput'), t = inp.value.trim().replace(/^#/, '');
  if (!t) return;
  ME.tags[id] = [...new Set(tagsOf(id).concat(t))]; saveMe(); invalidateSearch(); render();
  $('#tagInput') && $('#tagInput').focus();
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.facet) {
    const k = t.dataset.facet;
    S.f[k] = t.checked ? [...S.f[k], t.value] : S.f[k].filter(v => v !== t.value);
  } else if (t.id === 'sort') S.sort = t.value;
  else if (t.id === 'showHidden') S.showHidden = t.checked;
  else if (t.id === 'starredOnly') S.starredOnly = t.checked;
  else if (t.id === 'importFile') { if (t.files[0]) importJSON(t.files[0]); return; }
  else return;
  replaceHash(); render();
  $('#live').textContent = $('#count') ? $('#count').textContent : '';
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'filterPanel') filtersOpenState = ev.target.open; }, true);
let notesTimer;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'notes') {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => {
      const v = t.value.trim() ? t.value : null;
      if (v) ME.notes[t.dataset.id] = v; else delete ME.notes[t.dataset.id];
      saveMe(); invalidateSearch();
      $('#notesStatus').textContent = storageOK ? 'Saved in this browser.' : 'Could not save (storage blocked) — export a backup.';
    }, 400);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'tagInput' && ev.key === 'Enter') { ev.preventDefault(); addTag(ev.target.dataset.id); }
  if (ev.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); $('#q').focus(); }
});
let qTimer;
$('#q').addEventListener('input', ev => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    S.q = ev.target.value.trim();
    if (S.v !== 'browse' && S.v !== 'post' && S.v !== 'shared') S.v = 'browse';
    if (S.v === 'post') S.v = 'browse';
    replaceHash(); render();
    $('#live').textContent = $('#count') ? $('#count').textContent : '';
  }, 180);
});

/* drag-and-drop ranking (mouse); ↑ ↓ buttons cover keyboard and touch */
let dragId = null;
document.addEventListener('dragstart', ev => {
  const li = ev.target.closest && ev.target.closest('.rank-item'); if (!li) return;
  dragId = li.dataset.id; li.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', dragId);
});
document.addEventListener('dragover', ev => {
  const li = ev.target.closest && ev.target.closest('.rank-item'); if (!li || !dragId) return;
  ev.preventDefault();
  document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  const r = li.getBoundingClientRect();
  li.classList.add(ev.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
document.addEventListener('drop', ev => {
  const li = ev.target.closest && ev.target.closest('.rank-item'); if (!li || !dragId) return;
  ev.preventDefault();
  const before = li.classList.contains('drop-before'), target = li.dataset.id;
  const ids = ME.rank.filter(x => BY_ID[x] && x !== dragId);
  if (target !== dragId) {
    ids.splice(ids.indexOf(target) + (before ? 0 : 1), 0, dragId);
    ME.rank = ids.concat(ME.rank.filter(x => !BY_ID[x])); saveMe();
  }
  dragId = null; render();
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });

/* theme: auto -> light -> dark */
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
$('#themeBtn').addEventListener('click', () => {
  const u = loadUI(), next = { undefined: 'light', light: 'dark', dark: undefined }[u.theme];
  u.theme = next; saveUI(u); applyTheme(next); toast('Theme: ' + (next || 'same as system'));
});

/* after every render: focus management for detail view */
let lastView = null, lastPost = null;
function afterRender() {
  if (S.v === 'post' && (lastView !== 'post' || lastPost !== S.post)) { window.scrollTo(0, 0); const h = $('#postTitle'); h && h.focus({ preventScroll: true }); }
  else if (S.v !== lastView && lastView !== null && S.v !== 'browse') window.scrollTo(0, 0);
  lastView = S.v; lastPost = S.post;
}

/* =====================================================================================================
   START
   ===================================================================================================== */
applyTheme(loadUI().theme);
$('#buildDate').textContent = 'Data version: ' + DATA.built;
$('#footer').innerHTML = `MRP 2026 Explorer · unofficial · data built ${esc(DATA.built)} · ${POSTS.length} posts, ${POSTS.filter(p => p.has_full_jo).length} with full JO · your notes stay in this browser.`;
if (!storageOK) $('#storageWarning').hidden = false;
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
</script>
</body>
</html>
