services:
  - type: web
    name: unsocialtracker
    runtime: node
    plan: free
    buildCommand: >-
      cd frontend && npm install && npm run build &&
      cd ../backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REFRESH_CRON_SECRET
        sync: false
